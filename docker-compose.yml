version: '3.8'

# To deploy:
# 1. Run generate_metadata.py and generate_embeddings.py locally to create data/metadata and data/embeddings
# 2. Run docker-compose up --build
# 3. Provide DATABASE_URL (Neon) and Groq keys via .env or deployment secrets

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - ./data:/app/data
    networks:
      - medassist_network

networks:
  medassist_network: